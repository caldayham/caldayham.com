<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demos - Cal Day Ham</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .video-embed {
            position: relative;
            aspect-ratio: 4 / 3;
            width: 100%;
        }

        .video-embed iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <main>
        <button id="settings-toggle" class="settings-icon" aria-label="Settings">
            <img src="/assets/setting-black.svg" alt="Settings" width="20" height="20">
        </button>

        <div id="settings-popup" class="settings-popup hidden">
            <h3>Settings</h3>
            <div class="setting-group">
                <label>Theme</label>
                <div class="setting-buttons">
                    <button class="setting-btn active" data-theme="light">Light</button>
                    <button class="setting-btn" data-theme="dark">Dark</button>
                </div>
            </div>
            <div class="setting-group">
                <label>Text Size</label>
                <div class="setting-buttons">
                    <button class="setting-btn" data-size="small">Small</button>
                    <button class="setting-btn active" data-size="medium">Medium</button>
                    <button class="setting-btn" data-size="large">Large</button>
                </div>
            </div>
        </div>

        <header>
            <h1>Cal Day Ham</h1>
            <p class="subtitle">Demos</p>
        </header>

        <nav>
            <a href="index.html">Home</a>
        </nav>

        <!-- To add a demo: copy a <section> block, put the new one at the top,
             and swap the Loom ID (share/<id> becomes embed/<id>). -->

        <section>
            <h2>Field360: Client Recordings to Proposals</h2>
            <p>Turns a recorded client consultation into a full proposal, then handles signatures and invoicing.</p>
            <div class="video-embed">
                <iframe src="https://www.loom.com/embed/d7202526a84a443384e7c39311a7dc7f"
                        title="Field360: client recordings to proposals"
                        allowfullscreen></iframe>
            </div>
        </section>
    </main>
    <script src="settings.js"></script>
</body>
</html>
